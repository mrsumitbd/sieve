name: Sync to HuggingFace Spaces

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "mrsumitbd@users.noreply.github.com"
          git config --global user.name "Musfiqur Rahman"
          git push https://mrahman2025:${HF_TOKEN}@huggingface.co/spaces/mrahman2025/sieve main --force
