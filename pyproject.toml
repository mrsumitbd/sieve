[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-corpus"
version = "0.1.0"
description = "Software Ingestion & Extraction for Verifiable Evaluation — parameterized GitHub corpus builder for SE research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyGithub>=2.1.1",
    "requests>=2.31.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "pydantic>=2.5.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "datasketch>=1.6.4",
    "streamlit>=1.30.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "autopep8>=2.0.4",
]

[project.scripts]
sieve = "sieve.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sieve*"]

[tool.setuptools.package-data]
"sieve.ui.demo_data" = ["*.jsonl", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]